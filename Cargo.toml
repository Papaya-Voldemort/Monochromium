[package]
name = "monochromium"
version = "0.5.0"
edition = "2024"
description = "A fast, local-first CLI note-taking app for developers"
readme = "README.md"
repository = "https://github.com/Papaya-Voldemort/Monochromium"
license = "MIT"
keywords = ["notes", "cli", "terminal", "productivity"]
categories = ["command-line-utilities"]

exclude = [
    "demo.gif",
    "banner.png",
    ".github/",
    "spec.md"
]

[[bin]]
name = "mono"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3.6", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
thiserror = "2.0.20"
tempfile = "3"
shlex = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }