[package]
name = "Monochromium"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mono"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
libsql = "0.9.30"
tokio = { version = "1", features = ["rt", "macros"] }
