[package]
name = "monochromium"
version = "0.2.0"
edition = "2024"
description = "A fast, local-first CLI note-taking app for developers"
readme = "README.md"
repository = "https://github.com/Papaya-Voldemort/Monochromium"
license = "MIT"
keywords = ["notes", "cli", "terminal", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "mono"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3.6", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }